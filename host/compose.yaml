services:
  host:
    build: .
    env_file:
      - .env
    environment:
      AUTH_FILE: /app/state/auth.json
      COORDINATOR_URL: "${COORDINATOR_URL:?Set COORDINATOR_URL in host/.env to your VPS HTTPS URL}"
    volumes:
      - host_auth:/app/state
    restart: unless-stopped

volumes:
  host_auth:
